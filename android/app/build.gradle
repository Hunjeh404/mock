plugins { id 'com.android.application' }
android {
    namespace 'com.hoonjay.filmroom'
    compileSdk 35
    defaultConfig {
        applicationId 'com.hoonjay.presscamera'
        minSdk 30
        targetSdk 35
        versionCode 10101
        versionName '1.1.1'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '' }; release { minifyEnabled false } }
}
