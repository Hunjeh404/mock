<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>국어 모의고사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ef; --paper:#fff; --ink:#1d1d1f; --sub:#6b6b70; --line:#dedad2;
    --accent:#2f5d50; --accent-soft:#e3eee9; --ok:#2f7a4a; --no:#b23b3b; --mark:#fff3c4;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 120px}
  h1{font-size:22px;margin:8px 0 4px}
  h2{font-size:18px;margin:0 0 8px}
  .sub{color:var(--sub);font-size:14px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:18px;margin:14px 0}
  .setbtn{display:block;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin:10px 0;font:inherit;cursor:pointer}
  .setbtn:hover{border-color:var(--accent)}
  .setbtn b{display:block;font-size:17px}
  .passage{font-family:"Noto Serif KR",serif;font-size:16px;line-height:1.9}
  .passage p{margin:0 0 10px;text-indent:1em}
  .passage p.noind{text-indent:0}
  .plabel{font-family:"Noto Sans KR",sans-serif;font-weight:700;margin-bottom:6px}
  .bracket{border-left:3px solid var(--ink);padding-left:12px;margin:0 0 10px;position:relative}
  .bracket .tag{position:absolute;left:-40px;top:0;font-family:"Noto Sans KR",sans-serif;font-weight:700;font-size:14px}
  @media (max-width:600px){.bracket .tag{position:static;display:block;margin-bottom:2px}}
  u{text-underline-offset:4px}
  .box{border:1px solid var(--ink);padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.8}
  .box .bt{text-align:center;font-weight:500;margin-bottom:4px}
  .q{margin:18px 0 6px}
  .qstem{font-weight:500;margin-bottom:8px}
  .qstem .neg{text-decoration:underline;text-underline-offset:3px}
  .choice{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin:6px 0;font:inherit;font-size:15px;cursor:pointer;color:var(--ink)}
  .choice .n{flex:0 0 auto;font-weight:700}
  .choice.sel{border-color:var(--accent);background:var(--accent-soft)}
  .choice.isans{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
  .choice.wrongpick{border-color:var(--no);background:#fbecec}
  .choice[disabled]{cursor:default}
  .bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
  .bar .in{max-width:760px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between}
  .btn{font:inherit;font-weight:700;border-radius:10px;padding:11px 16px;border:1px solid var(--accent);background:var(--accent);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .warn{color:var(--no);font-size:14px;margin-top:8px}
  .score{font-size:30px;font-weight:700}
  .oxlist{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-top:10px}
  .ox{border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 0;font-size:14px}
  .ox b{display:block;font-size:20px}
  .ox.o b{color:var(--ok)} .ox.x b{color:var(--no)}
  input[type=password]{font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;width:140px;letter-spacing:4px}
  textarea{width:100%;height:180px;font-family:ui-monospace,Menlo,monospace;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:8px}
  .exp{background:#faf8f3;border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 4px;font-size:15px}
  .exp .h{font-weight:700;margin-bottom:4px}
  .pill{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;color:var(--sub);margin-left:6px;font-weight:400}
  .hidden{display:none}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="bar hidden" id="bar"><div class="in"><span id="prog" class="sub"></span><button class="btn" id="submitBtn">제출하기</button></div></div>

<script>
const PASSWORD = "0000";
const CN = ["①","②","③","④","⑤"];

const SETS = [
{
  id:"s1", title:"1세트", note:"1일차 출발점 확인",
  passages:{
    "가":`
<div class="bracket"><span class="tag">[A]</span><p>버스는 한 시간에 한 대였다. 정류장 앞 구멍가게 처마 밑에 옥분 할머니가 보따리를 무릎에 얹고 앉아 있었다. 볕이 슬레이트 지붕을 달구는지 처마 끝에서 탁, 탁 소리가 났다. 할머니는 손등으로 이마의 땀을 훔치고, 보따리 매듭을 풀었다가 다시 묶었다. 신작로 끝을 몇 번이나 내다보아도 버스는 보이지 않았다.</p></div>
<p>보따리 안에는 손녀 은지가 좋아하는 쑥떡이 들어 있었다. 새벽부터 쑥을 뜯고 떡을 빚느라 허리가 끊어질 듯했지만, 할머니는 그런 것을 대수롭게 여기지 않았다.</p>
<p>'서울 사는 애들은 이런 거 안 먹는다던데…….'</p>
<p>할머니는 떡이 식을까 봐 보따리를 배 쪽으로 끌어당겼다.</p>
<p>그때 멀리서 ㉠<u>털털털 경운기 소리</u>가 들려왔다. 그 소리를 듣자 할머니의 머릿속에 삼십 년 전 봄날이 떠올랐다. 그날 남편은 경운기를 몰고 읍내 장에 나갔다가 돌아오지 못했다. 비탈길에서 경운기가 넘어졌다는 소식을 들은 것은 해가 다 진 뒤였다. 그날 밤 할머니는 식은 밥상 앞에 혼자 앉아 있었다.</p>
<p>㉡<u>"할머니, 버스 왔어요!"</u></p>
<p>가겟집 아이의 목소리에 할머니는 퍼뜩 고개를 들었다. 어느새 파란 버스가 정류장에 서 있었다. 할머니는 허둥지둥 일어서다가 보따리를 떨어뜨릴 뻔했다. 버스에서 은지가 내리더니 할머니를 보고 손을 크게 흔들었다. 할머니는 그제야 마음이 놓였다.</p>
<p>"할머니, 이거 엄마가 보냈어요."</p>
<p>은지가 내민 것은 새 밀짚모자였다. 할머니는 모자를 받아 들고 한참 동안 챙만 만지작거렸다.</p>`,
    "나":`
<p class="noind">교장 선생님께</p>
<p>저는 2학년 김도윤입니다. 학교 도서관 운영 시간을 오후 6시까지 늘려 주시기를 건의드립니다. 지금 도서관은 오후 4시 30분에 문을 닫아, 동아리 활동을 마친 학생들은 책을 빌릴 수 없습니다. 지난주 2학년 120명에게 설문한 결과 84명이 운영 시간 연장을 원했습니다.</p>
<p>이웃 ○○중학교는 작년부터 도서관을 오후 6시까지 열었는데, 한 해 대출 권수가 이전보다 1.5배 늘었다고 합니다. 사서 선생님의 업무가 늘어날 수 있다는 걱정도 있습니다. 그래서 도서부원들이 요일을 나누어 당번을 서는 방법을 제안합니다. 긍정적으로 검토해 주시면 감사하겠습니다.</p>`
  },
  groups:[{label:"[1~4] (가)를 읽고 물음에 답하시오.",p:"가",qs:[0,1,2,3]},{label:"[5] 다음 물음에 답하시오.",p:null,qs:[4]},{label:"[6] (나)를 읽고 물음에 답하시오.",p:"나",qs:[5]}],
  questions:[
    {stem:"(가)의 서술상 특징으로 가장 적절한 것은?",neg:false,type:"시점",
     choices:["작품 밖의 서술자가 할머니와 은지의 속마음을 번갈아 가며 전달하고 있다.","작품 속 인물인 가겟집 아이가 할머니를 지켜보며 할머니의 행동을 전달하고 있다.","작품 밖의 서술자가 할머니의 행동을 전하면서 할머니의 속생각도 드러내고 있다.","작품 밖의 서술자가 인물의 행동만 보여 줄 뿐, 인물의 생각은 드러내지 않는다.","작품 밖의 서술자가 과거와 현재를 오가며, 회상 장면에서는 남편의 시선으로 사건을 전하고 있다."],
     answer:3,
     exp:"'할머니는 ~했다'처럼 작품 밖 서술자가 할머니의 행동을 전하고, '대수롭게 여기지 않았다', '서울 사는 애들은…' 같은 속생각도 드러낸다.<br>① 앞부분은 맞지만 은지의 속마음은 나오지 않는다.<br>② 가겟집 아이는 대사 한 번만 하는 인물이다. 서술자 '나'가 없다.<br>④ 할머니의 생각이 드러난다.<br>⑤ 과거와 현재를 오가는 것은 맞지만, 회상도 할머니의 기억으로 서술된다. 남편의 시선이 아니다.<br>판단 포인트: 앞부분이 맞아도 뒷부분 하나가 틀리면 틀린 선지다."},
    {stem:"[A]에 대한 설명으로 가장 적절한 것은?",neg:false,type:"범위",
     choices:["청각적 이미지와 인물의 반복적 행동을 통해 버스를 기다리는 인물의 마음을 간접적으로 드러낸다.","감각적 묘사로 무더운 날씨를 드러내고, 인물이 지난 일을 떠올리는 계기를 마련한다.","반복되는 행동으로 인물의 초조함을 드러내면서, 서술자가 인물의 처지를 직접 안타까워한다.","버스가 드문 시골 정류장을 배경으로 제시하고, 인물 간의 대화로 기다리는 이유를 밝힌다.","'초조했다'처럼 인물의 심리를 직접 서술하여 기다림의 지루함을 강조한다."],
     answer:1,
     exp:"[A]는 첫 문단뿐이다. 처마 끝 '탁, 탁' 소리(청각), 매듭을 풀었다 다시 묶고 길 끝을 몇 번이나 내다보는 행동(반복)으로 기다리는 마음을 짐작하게 한다.<br>② 앞부분은 맞다. 하지만 지난 일을 떠올리는 계기는 [A] 밖의 ㉠이다. 묻는 범위를 벗어났다.<br>③ 앞부분은 맞지만 서술자가 안타까워하는 말이 없다.<br>④ [A]에는 대화가 없고, 기다리는 이유(손녀)도 [A] 밖에 나온다.<br>⑤ '초조했다' 같은 직접 서술은 없다. 간접 제시다."},
    {stem:"㉠과 ㉡의 기능에 대한 설명으로 가장 적절한 것은?",neg:false,type:"회상 전환",
     choices:["㉠은 과거의 사고를 떠올리게 하는 소리이고, ㉡은 인물이 회상에 더 깊이 빠져들게 한다.","㉠과 ㉡은 모두 청각적 요소로, 인물이 과거의 아픈 기억을 떠올리게 한다.","㉠은 버스가 가까이 왔음을 알려 인물을 긴장하게 하고, ㉡은 인물을 현재로 돌아오게 한다.","㉠은 인물이 과거를 떠올리는 계기가 되고, ㉡은 인물이 남편을 잃은 슬픔을 이겨 냈음을 보여 준다.","㉠을 계기로 인물의 의식이 과거로 옮겨 가고, ㉡을 계기로 인물이 현재의 상황으로 돌아온다."],
     answer:5,
     exp:"㉠ 경운기 소리를 듣자 삼십 년 전 일이 떠오르고(회상 진입), ㉡ 아이의 목소리에 '퍼뜩 고개를 들었다'(현재 복귀).<br>① ㉠은 맞지만 ㉡은 방향이 반대다.<br>② 둘 다 소리인 것은 맞지만 ㉡은 기억을 떠올리게 하지 않는다.<br>③ ㉡은 맞지만 ㉠은 버스가 아니라 경운기 소리다.<br>④ ㉠은 맞지만 ㉡에서 슬픔을 이겨 냈다는 근거는 없다. 지문보다 넓힌 해석이다."},
    {stem:"(가)의 내용으로 적절하지 <span class=\"neg\">않은</span> 것은?",neg:true,type:"내용 확인",
     choices:["할머니는 새벽부터 쑥떡을 빚느라 몸이 고되었지만 그것을 대수롭게 여기지 않았다.","할머니의 남편은 경운기를 몰고 읍내 장에 갔다가 비탈길에서 사고를 당했다.","할머니는 남편의 사고 소식을 해가 다 진 뒤에야 들었다.","할머니는 버스가 도착하자 서둘러 일어서다가 보따리를 떨어뜨렸다.","할머니에게 밀짚모자를 보낸 사람은 은지의 엄마이다."],
     answer:4,
     exp:"지문은 '보따리를 떨어뜨릴 뻔했다'이다. 떨어뜨리지는 않았다. 한 단어만 바꾼 선지다.<br>①②③⑤는 지문과 맞다."},
    {stem:"<보기>의 카드에 넣을 내용으로 적절하지 <span class=\"neg\">않은</span> 것은?",neg:true,type:"조건 확인",
     box:"새로 입학한 1학년이 처음 도서관에 올 때 꼭 지켜야 할 예절을 알리는 안내 카드를 만들자. 카드 한 장에 그림 하나와 한 줄 문구만 넣어서, 지나가면서도 한눈에 읽을 수 있게 해야지.",
     choices:["도서관 안에서 작은 목소리로 이야기하는 학생의 그림","도서관에서 지켜야 할 예절 열 가지를 번호를 붙여 차례대로 자세히 설명한 글","다 읽은 책은 제자리에 꽂아 두자는 한 줄 문구","가방만 두고 자리를 맡아 두지 말자는 한 줄 문구","음료를 들고 들어오지 말자는 한 줄 문구"],
     answer:2,
     exp:"<보기>의 조건은 두 가지다. 내용은 '1학년이 지켜야 할 예절', 형식은 '그림 하나와 한 줄 문구, 한눈에'.<br>②는 내용(예절)은 맞지만 형식 조건을 어긴다. 열 가지를 자세히 설명한 글은 한눈에 읽을 수 없다.<br>내용만 보고 맞다고 판단하면 틀린다. 조건이 여러 개면 하나씩 다 확인한다. (중간고사 20번과 같은 판단)"},
    {stem:"(나)에 대한 설명으로 적절하지 <span class=\"neg\">않은</span> 것은?",neg:true,type:"주체 확인",
     choices:["설문 결과를 수치로 제시하여 건의의 필요성을 뒷받침하고 있다.","다른 학교의 사례를 들어 운영 시간을 늘렸을 때의 효과를 보여 주고 있다.","예상되는 문제점에 대해 사서 선생님이 직접 제안한 해결 방안을 소개하고 있다.","현재 운영 시간 때문에 생기는 불편을 구체적으로 밝히고 있다.","건의를 받는 사람을 고려하여 공손한 표현으로 글을 마무리하고 있다."],
     answer:3,
     exp:"문제점(사서 선생님 업무 증가)과 해결 방안(도서부원 당번)을 제시한 것은 맞다. 그런데 해결 방안을 제안한 사람은 글쓴이 김도윤이다. 사서 선생님이 제안했다는 말은 없다.<br>앞부분이 맞아서 그냥 넘기기 쉬운 선지다. '누가' 했는지 확인한다."}
  ]
},
{
  id:"s2", title:"2세트", note:"5일차 1차 적용 확인",
  passages:{
    "가":`
<p>아버지의 자전거는 나보다 나이가 많았다. 페달을 밟을 때마다 끼익끼익 우는 소리가 났고, 짐받이에는 녹이 꽃처럼 피어 있었다. 친구들이 새 자전거를 타고 학교 앞을 지나갈 때면, 나는 그 낡은 자전거를 담벼락 뒤에 세워 두었다.</p>
<p>그날도 나는 자전거를 숨겨 두고 걸어서 교문을 나섰다. 그런데 집에 와 보니 자전거가 마당에 서 있었다. 아버지가 일터에서 돌아오는 길에 담벼락 뒤에서 찾아 끌고 온 것이었다.</p>
<p>"자전거는 타라고 있는 기다."</p>
<p>아버지는 그 말만 하고 마당에 쪼그리고 앉았다. 그리고 공구 상자를 열어 체인에 기름을 칠하기 시작했다. 나는 얼굴이 화끈거렸다. 숨겨 둔 것을 아버지가 알았다는 사실이 무엇보다 부끄러웠다.</p>
<p>나는 마루 끝에 앉아 아버지의 등을 바라보았다. 아버지는 한참 동안 바퀴를 돌려 보다가, 바퀴살 하나를 손가락으로 튕겨 보았다. 팅, 하고 맑은 소리가 났다. 아버지는 그 소리가 마음에 드는지 고개를 한 번 끄덕였다.</p>

<p>이삿짐 트럭이 곧 올 시각이었다. 정우는 빈 방에 쪼그려 앉아 마지막 상자를 채우고 있었다. 벽지에는 책상이 있던 자리만 네모나게 하얗게 남아 있었다.</p>
<p>상자 맨 밑에서 ㉠<u>낡은 야구 글러브</u>가 나왔다. 손을 넣어 보니 손등이 꽉 끼었다. 정우는 글러브를 끼고 주먹으로 가운데를 퍽퍽 쳐 보았다.</p>
<p>그 소리에 정우는 열 살 때의 골목으로 돌아가 있었다. 형은 해가 질 때까지 공을 던져 주었다. 정우가 공을 놓칠 때마다 형은 웃지도 화내지도 않고 "다시."라고만 말했다. 그해 겨울, 형은 먼 도시의 학교로 떠났고 글러브는 정우의 것이 되었다.</p>
<p>㉡<u>"정우야, 트럭 왔다!"</u></p>
<p>마당에서 어머니가 불렀다. 정우는 글러브를 상자에 넣으려다 말고, 가방 앞주머니에 꾹꾹 눌러 담았다. 그리고 상자에 테이프를 길게 뜯어 붙였다. 찍, 하는 소리가 빈 방을 울렸다. 정우는 형에게 전화를 걸어 봐야겠다고 생각했다.</p>`,

<p>그러나 나는 휴대 전화를 걷는 것만으로 문제가 해결된다고 보지 않는다. 학생들은 하교 후에 그동안 보지 못한 영상을 몰아서 보기도 한다. 휴대 전화를 언제, 얼마나 쓸지 스스로 정하는 연습이 함께 이루어져야 제도의 효과가 오래갈 수 있다. 교실에서 휴대 전화를 치우는 일과 학생이 스스로 조절하는 힘을 기르는 일은 함께 가야 한다.</p>`

     choices:["'형에게 전화를 걸어 봐야겠다고 생각했다'는 행동을 통해 정우의 마음을 간접적으로 보여 준 것이다.","정우가 글러브를 상자에 넣으려다 가방 앞주머니에 담는 모습은 행동을 통해 정우의 마음을 간접적으로 보여 준다.","'다시.'라고만 말하는 형의 대사는 서술자가 형의 속마음을 직접 밝힌 것이다.","벽지에 네모나게 남은 하얀 자국은 서술자가 정우의 서운함을 직접 밝힌 것이다.","테이프를 뜯는 '찍' 소리는 이사를 반기는 정우의 들뜬 마음을 직접 드러낸다."],
     answer:2,
     exp:"글러브를 따로 챙기는 행동으로 형과의 추억을 아끼는 마음을 짐작하게 한다(간접 제시).<br>① '생각했다'는 서술자가 생각을 직접 알려 준 것이다(직접 제시). 개념을 바꾼 선지다.<br>③ 인물의 대사는 간접 제시다.<br>④ 빈 방의 모습을 묘사한 것이다. 서운하다는 말은 없다.<br>⑤ 들뜬 마음의 근거가 없고, 직접 드러낸 것도 아니다."},
    {stem:"(가)의 내용과 일치하는 것은?",neg:false,type:"내용 일치",
     choices:["형은 해가 질 때까지 공을 던져 주었고, 정우가 공을 놓치면 웃으며 격려했다.","글러브는 형이 먼 도시의 학교로 떠나기 전에 정우에게 직접 건네준 것이다.","정우는 이삿짐을 다 싼 뒤 형에게 전화를 걸어 글러브 이야기를 했다.","정우는 어머니가 부르자 글러브를 이삿짐 상자에 넣고 테이프를 붙였다.","형은 정우가 공을 놓쳐도 웃거나 화내지 않고 짧게 다시 하자고 했다."],
     answer:5,
     exp:"'웃지도 화내지도 않고 \"다시.\"라고만 말했다'와 맞다.<br>① 공을 던져 준 것은 맞지만 웃지 않았다.<br>② '글러브는 정우의 것이 되었다'고만 했다. 직접 건네주었다는 말은 없다.<br>③ 전화는 걸어 봐야겠다고 생각만 했다.<br>④ 상자가 아니라 가방 앞주머니에 담았다."},
    {stem:"(나)의 글쓴이와 '교육학자'의 견해로 가장 적절한 것은?",neg:false,type:"주체 확인",
     choices:["교육학자는 제도의 효과를 설명하고, 글쓴이는 그 효과를 인정하면서도 제도만으로는 부족하다고 본다.","교육학자와 글쓴이는 모두 휴대 전화를 걷으면 쉬는 시간의 대면 대화가 늘어난다고 설명한다.","교육학자는 수업 집중도가 높아진다고 보고, 글쓴이는 하교 후 영상 시청이 줄어든다고 본다.","글쓴이는 교육학자의 설명을 반박하며 휴대 전화를 걷는 제도를 그만두어야 한다고 주장한다.","교육학자는 제도의 한계를 지적하고, 글쓴이는 학생 스스로 조절하는 연습이 필요하다고 본다."],
     answer:1,
     exp:"교육학자는 '수업 집중도를 높이고 대면 대화를 늘린다'고 설명한다. 글쓴이는 '걷는 것만으로' 해결되지 않는다며 '함께 가야 한다'고 한다.<br>② 대면 대화를 말한 사람은 교육학자뿐이다(주체).<br>③ 교육학자 부분은 맞지만 글쓴이는 영상을 '몰아서 본다'고 했다.<br>④ 그만두자고 하지 않았다.<br>⑤ 글쓴이 부분은 맞지만 한계를 지적한 사람은 글쓴이다. (중간고사 6번과 같은 판단)"},
    {stem:"(나)에 대한 이해로 적절하지 <span class=\"neg\">않은</span> 것은?",neg:true,type:"근거 검증",
     choices:["다른 사람의 설명을 소개한 뒤 글쓴이 자신의 견해를 밝히고 있다.","제도의 운영 방식을 먼저 설명하여 독자의 이해를 돕고 있다.","운동장에 나가는 학생이 늘어난 사례를 들어 제도의 한계를 보여 주고 있다.","하교 후 영상을 몰아 보는 학생들의 모습을 근거로 제도만으로는 부족하다고 본다.","제도와 스스로 조절하는 힘을 기르는 일이 함께 이루어져야 한다고 주장한다."],
     answer:3,
     exp:"사례 자체는 지문에 있다. 하지만 운동장에 나가는 학생이 늘어난 것은 제도의 '효과'로 소개된 사례다. 한계를 보여 주는 사례는 ④의 '하교 후 몰아 보기'다.<br>사례는 맞고, 그 사례의 역할을 바꾼 선지다."}
  ]
}
];

const app = document.getElementById('app');
const bar = document.getElementById('bar');
const prog = document.getElementById('prog');
const submitBtn = document.getElementById('submitBtn');
let S = null; // {set, answers:[], startedAt, submittedAt, unlocked, warned}
const STORE_KEY = 'korean-mock-records-v1';
function loadRecs(){ try{ return JSON.parse(localStorage.getItem(STORE_KEY))||{}; }catch(e){ return {}; } }
function saveRecs(r){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(r)); return true; }catch(e){ return false; } }

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function stemHTML(s){return s.replace(/<보기>/g,'&lt;보기&gt;');}
function textOnly(html){const d=document.createElement('div');d.innerHTML=html.replace(/<br\s*\/?>/g,'\n').replace(/<\/p>/g,'\n').replace(/<\/div>/g,'\n');return d.textContent.replace(/\n\s*\n+/g,'\n').trim();}

function home(){
  S=null; bar.classList.add('hidden'); const recs=loadRecs();
  app.innerHTML=`<h1>국어 모의고사</h1>
  <div class="sub">세트마다 6문항입니다. 답을 고르고 제출하면 맞은 문항이 표시됩니다. 정답 번호와 해설은 비밀번호가 있어야 볼 수 있습니다.</div>
  ${SETS.map((s,i)=>{const r=recs[s.id]; const st=r?`완료 · ${r.answers.filter((a,qi)=>a===s.questions[qi].answer).length}/6 · ${new Date(r.submittedAt).toLocaleDateString('ko-KR')}`:'6문항'; return `<button class="setbtn" data-i="${i}"><b>${s.title}</b><span class="sub">${s.note} · ${st}</span></button>`;}).join('')}`;
  app.querySelectorAll('.setbtn').forEach(b=>b.onclick=()=>{const set=SETS[+b.dataset.i]; const r=recs[set.id];
    if(r){ S={set, answers:r.answers, startedAt:new Date(r.startedAt), submittedAt:new Date(r.submittedAt), unlocked:false}; renderResult(); window.scrollTo(0,0); }
    else start(set);});
  window.scrollTo(0,0);
}

function start(set){
  S={set, answers:Array(set.questions.length).fill(null), startedAt:new Date(), submittedAt:null, unlocked:false};
  renderExam(); window.scrollTo(0,0);
}

function boxHTML(t){return `<div class="box"><div class="bt">&lt;보기&gt;</div>${esc(t)}</div>`;}

function qHTML(set,qi,mode){
  const q=set.questions[qi];
  const chosen=S.answers[qi];
  let h=`<div class="q" id="q${qi}"><div class="qstem">${qi+1}. ${stemHTML(q.stem)}${mode==='review'?`<span class="pill">${q.type}</span>`:''}</div>`;
  if(q.box) h+=boxHTML(q.box);
  q.choices.forEach((c,ci)=>{
    const n=ci+1; let cls='choice';
    if(chosen===n) cls+=' sel';
    if(mode==='review'){ if(n===q.answer) cls+=' isans'; if(chosen===n && n!==q.answer) cls+=' wrongpick'; }
    h+=`<button class="${cls}" data-q="${qi}" data-c="${n}" ${mode!=='exam'?'disabled':''}><span class="n">${CN[ci]}</span><span>${esc(c)}</span></button>`;
  });
  if(mode==='review'){
    const ok=chosen===q.answer;
    h+=`<div class="exp"><div class="h">${ok?'맞음':'틀림'} · 고른 답 ${chosen?CN[chosen-1]:'없음'} · 정답 ${CN[q.answer-1]}</div>${q.exp.replace(/<보기>/g,'&lt;보기&gt;')}</div>`;
  }
  return h+'</div>';
}

function bodyHTML(set,mode){
  return set.groups.map(g=>{
    let h=`<div class="card"><div class="plabel">${g.label}</div>`;
    if(g.p) h+=`<div class="passage"><div class="plabel">(${g.p})</div>${set.passages[g.p]}</div>`;
    g.qs.forEach(qi=>h+=qHTML(set,qi,mode));
    return h+'</div>';
  }).join('');
}

function renderExam(){
  const set=S.set;
  app.innerHTML=`<button class="btn ghost" id="back">← 세트 목록</button>
  <h1>${set.title} <span class="sub">${set.note}</span></h1>
  ${bodyHTML(set,'exam')}<div id="warn" class="warn"></div>`;
  document.getElementById('back').onclick=home;
  app.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{
    const qi=+b.dataset.q, c=+b.dataset.c;
    S.answers[qi]=c;
    app.querySelectorAll(`.choice[data-q="${qi}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.c===c));
    updateBar();
  });
  bar.classList.remove('hidden'); updateBar();
}

function updateBar(){
  const n=S.answers.filter(a=>a!==null).length;
  prog.textContent=`${n} / ${S.answers.length} 문항 답함`;
  document.getElementById('warn').textContent='';
}

submitBtn.onclick=()=>{
  const empty=S.answers.map((a,i)=>a===null?i+1:null).filter(Boolean);
  const w=document.getElementById('warn');
  if(empty.length && !S.warned){
    S.warned=true;
    w.textContent=`${empty.join(', ')}번에 답하지 않았습니다. 그대로 내려면 제출하기를 한 번 더 누르세요.`;
    w.scrollIntoView({behavior:'smooth',block:'center'});
    return;
  }
  S.submittedAt=new Date(); bar.classList.add('hidden');
  const recs=loadRecs(); recs[S.set.id]={answers:S.answers, startedAt:S.startedAt.toISOString(), submittedAt:S.submittedAt.toISOString()}; S.saved=saveRecs(recs);
  renderResult(); window.scrollTo(0,0);
};

function buildJSON(){
  const set=S.set;
  const items=set.questions.map((q,i)=>({
    no:i+1, type:q.type, polarity:q.neg?'부정 발문':'긍정 발문',
    passage:set.groups.find(g=>g.qs.includes(i)).p,
    stem:textOnly(stemHTML(q.stem)), box:q.box||null,
    choices:q.choices.map((c,ci)=>CN[ci]+' '+c),
    chosen:S.answers[i], answer:q.answer, correct:S.answers[i]===q.answer
  }));
  const passages={}; Object.keys(set.passages).forEach(k=>passages[k]=textOnly(set.passages[k]));
  return JSON.stringify({
    app:"국어 모의고사", version:1, setId:set.id, setTitle:`${set.title} (${set.note})`,
    startedAt:S.startedAt.toISOString(), submittedAt:S.submittedAt.toISOString(),
    durationSec:Math.round((S.submittedAt-S.startedAt)/1000),
    score:{correct:items.filter(x=>x.correct).length,total:items.length},
    passages, items
  },null,2);
}

function renderResult(){
  const set=S.set;
  const res=set.questions.map((q,i)=>S.answers[i]===q.answer);
  const sc=res.filter(Boolean).length;
  const sec=Math.round((S.submittedAt-S.startedAt)/1000);
  app.innerHTML=`<button class="btn ghost" id="back">← 세트 목록</button>
  <h1>${set.title} 결과</h1>
  <div class="card"><div class="score">${sc} / ${res.length}</div>
    <div class="sub">걸린 시간 ${Math.floor(sec/60)}분 ${sec%60}초</div>
    <div class="oxlist">${res.map((r,i)=>`<div class="ox ${r?'o':'x'}">${i+1}번<b>${r?'O':'X'}</b></div>`).join('')}</div>
  </div>
  <div class="card"><h2>결과 JSON</h2>
    <div class="sub">복사해서 Claude 대화에 붙여넣으면 피드백을 받을 수 있습니다.</div>
    <div class="row"><button class="btn" id="copy">JSON 복사</button><button class="btn ghost" id="show">직접 복사하기</button></div>
    <div id="copymsg" class="sub" style="margin-top:6px"></div>
    <textarea id="jsonbox" class="hidden" readonly></textarea>
  </div>
  <div class="card" id="lock"><h2>해설 보기</h2>
    <div class="sub">비밀번호를 넣으면 정답 번호와 해설이 열립니다.</div>
    <form class="row" id="pwform"><input type="password" id="pw" inputmode="numeric" autocomplete="off" placeholder="••••"><button class="btn" type="submit">열기</button></form>
    <div id="pwmsg" class="warn"></div>
  </div>
  <div id="review"></div>
  <div class="row"><button class="btn ghost" id="again">기록 지우고 다시 풀기</button></div>${S.saved===false?'<div class="warn">이 기기에 기록을 저장하지 못했습니다. 화면을 닫기 전에 JSON을 복사해 두세요.</div>':''}`;
  document.getElementById('back').onclick=home;
  document.getElementById('again').onclick=()=>{
    if(!confirm(`${set.title} 기록을 지우고 처음부터 다시 풀까요?\n지운 기록은 되돌릴 수 없습니다.`)) return;
    const recs=loadRecs(); delete recs[set.id]; saveRecs(recs); start(set);
  };
  const json=buildJSON();
  const box=document.getElementById('jsonbox'); box.value=json;
  document.getElementById('copy').onclick=async()=>{
    const m=document.getElementById('copymsg');
    try{ await navigator.clipboard.writeText(json); m.textContent='복사했습니다.'; }
    catch(e){ box.classList.remove('hidden'); box.select(); m.textContent='자동 복사가 안 됩니다. 아래 칸을 길게 눌러 전체 선택 후 복사하세요.'; }
  };
  document.getElementById('show').onclick=()=>{box.classList.toggle('hidden'); if(!box.classList.contains('hidden')) box.select();};
  document.getElementById('pwform').onsubmit=e=>{
    e.preventDefault();
    if(document.getElementById('pw').value===PASSWORD){
      S.unlocked=true; document.getElementById('lock').classList.add('hidden');
      document.getElementById('review').innerHTML=`<h2 style="margin-top:20px">해설</h2>`+bodyHTML(set,'review');
    } else { document.getElementById('pwmsg').textContent='비밀번호가 맞지 않습니다.'; }
  };
}

home();
</script>
</body>
</html>
